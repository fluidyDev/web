/* Mise en page : un écran par message, façon formulaire pas à pas. Trois panneaux redimensionnables sans fond (journaux, question, ressources) sous un en-tête épuré ; aucune carte blanche, seuls les champs de saisie sont blancs. */
:root{
  --ink:#001828; --ink-60:rgba(0,24,40,.62); --ink-45:rgba(0,24,40,.45);
  --brand:#014e7e; --slate:#1d4761; --accent:#0080ff; --accent-soft:#90caf2;
  --page:#fbfcfd; --card:rgba(255,255,255,.9); --white:#ffffff;
  --line:rgba(159,162,164,.3); --line-strong:rgba(159,162,164,.5); --wash:rgba(1,78,126,.07);
  --ok:#146b3a; --ok-bg:#e6f5ec; --warn:#8e4310; --warn-bg:#fdede2; --danger:#a30000; --danger-bg:#ffebeb;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --display:'Kodchasan','Poppins',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 0 5.5px rgba(38,50,56,.16), inset 0 0 0 1px rgba(159,162,164,.28);
  --shadow-lg:0 12px 32px rgba(0,24,40,.14), inset 0 0 0 1px rgba(159,162,164,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.6;color:var(--ink);
  background:radial-gradient(ellipse 80% 55% at 18% -5%,rgba(144,202,242,.26) 0%,rgba(144,202,242,0) 100%),radial-gradient(ellipse 70% 50% at 105% 105%,rgba(159,162,164,.14) 0%,rgba(159,162,164,0) 100%),var(--page);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1080px}
h1,h2,h3{font-family:var(--display);color:var(--brand);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0 0 10px} p:last-child{margin-bottom:0}
ul,ol{margin:0 0 10px;padding-left:22px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.92em;background:var(--wash);padding:1px 5px;border-radius:4px}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin:0}
.card{padding:0}
.wrap>.card+.card{border-top:1px solid var(--line);padding-top:20px}
.muted{color:var(--ink-60)} .small{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* En-tête épuré, sans fond */
#app.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.hdr{flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 22px;padding:20px 44px 12px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.logo{width:120px;height:auto;display:block;margin:0 0 -2px -9px}
.logo-txt{font-family:var(--display);font-weight:600;font-size:24px;color:var(--brand);letter-spacing:.01em;line-height:1}
.hdr-title{flex:1;min-width:180px;padding-bottom:3px}
.hdr-title b{display:block;font-family:var(--display);font-size:17px;font-weight:600;line-height:1.25;color:var(--brand)}
.hdr-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:2px}
.hdr-tools .btn{background:transparent}
.hdr-tools .btn:hover,.hdr-tools .btn[aria-pressed=true]{background:var(--wash)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);font-size:12px;font-weight:600;color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(232,116,42,.45)}
.chip.read{color:var(--slate)}
.save{font-size:11px;color:var(--ink-45);white-space:nowrap}
.save.err{color:var(--danger);font-weight:600}
.progress{flex:none;height:2px;margin:0 44px;border-radius:2px;background:var(--line);overflow:hidden} .progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Trois panneaux */
.cols{flex:1;min-height:0;display:flex}
.pane{flex:none;min-width:0;display:flex;flex-direction:column}
.pane.left{width:var(--wl,340px)} .pane.right{width:var(--wr,400px)}
.pane-h{flex:none;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:14px 20px 8px}
.pane.left .pane-h{padding-left:44px} .pane.right .pane-h{padding-right:44px}
.pane-b{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:6px 20px 24px}
.pane.left .pane-b{padding-left:44px} .pane.right .pane-b{padding-right:44px}
.split{flex:none;width:11px;cursor:col-resize;position:relative;touch-action:none}
.split::after{content:"";position:absolute;top:14px;bottom:14px;left:5px;width:1px;background:var(--line-strong);transition:background .15s,width .15s,left .15s}
.split:hover::after,.split:focus-visible::after,body.resizing .split::after{background:var(--accent);width:3px;left:4px}
.split:focus-visible{box-shadow:none!important}
body.resizing{cursor:col-resize;-webkit-user-select:none;user-select:none}
.center{flex:1;min-width:0;display:flex;flex-direction:column;container-type:inline-size}
.center-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:8px 44px 24px}
.screen{width:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;gap:14px;padding-block:18px}
.screen.top{margin:0 auto}
.screen:has(table.fill),.screen:has(table.data){max-width:1040px}
.screen h1{font-size:30px}
.screen>*{margin-top:0;margin-bottom:0}
.screen:not(.top) .sjt{margin-top:0;padding-top:0;border-top:0}
.screen:not(.top) .qblock{margin-top:0;gap:10px}
.screen:not(.top) .qlabel{font-size:17px;line-height:1.5}
.screen:not(.top) .sjt>p:first-child{font-size:16px}
.big{font-size:19px;line-height:1.5;margin:0}
.stmt.big{font-size:16px;line-height:1.65}
.stmt.big li{margin-bottom:8px}
.est{flex:none;width:100%;max-width:720px;margin:0 auto}
.screen:has(table.fill)~.est,.est:has(~.screen table.fill){max-width:1040px}

/* Navigation : précédent, position, suivant */
.nav{flex:none;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 44px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nav-mid{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
.dots{display:flex;flex-wrap:wrap;justify-content:center;min-width:0}
.dot{appearance:none;border:0;padding:0;background:transparent;cursor:pointer;width:13px;height:18px;position:relative;border-radius:4px}
.dot::before{content:"";position:absolute;left:3px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:background .15s,transform .15s}
.dot.done::before{background:var(--accent-soft)}
.dot.cur::before{background:var(--brand);transform:scale(1.45)}
.dot:hover::before{background:var(--accent)}
.count{font-size:12px;color:var(--ink-60);font-variant-numeric:tabular-nums;white-space:nowrap}
.nav input[type=number]{width:96px}
.btn.quiet{background:transparent;box-shadow:none;color:var(--slate);text-decoration:underline;text-underline-offset:3px;padding:0 6px}
.btn.quiet:hover{background:transparent;color:var(--brand)}

/* Choix plein écran */
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick.tile{white-space:normal;border-radius:12px;padding:18px;font-size:15px;font-weight:500;line-height:1.5;align-items:flex-start;min-height:104px;color:var(--ink)}
.pick.tile input{margin-top:5px;flex:none}
.pick.tile:hover{box-shadow:inset 0 0 0 1px var(--brand)}
.pick.tile:has(input:checked){background:#e9f3fb;color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.lik-scale.wide{gap:10px}
.lik-scale.wide label{width:58px;height:58px;font-size:18px;border-radius:12px}

/* Ressources */
.res{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res-body{overflow-x:auto;min-width:0}
.res-body img{display:block;width:100%;height:auto;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.res-body.zoomable{cursor:zoom-in}
.res-body .stmt table,.res-body table.data{font-size:12px}
.res-body .tbl-wrap{margin-top:0}
.modal.wide{width:min(1280px,100%);height:calc(100% - 20px)}
.zoom-area{flex:1;min-height:0;overflow:auto;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);background:#fff;padding:0}
.zoom-area>.stmt,.zoom-area>div:not(.stmt){padding:14px 18px}

@container (max-width:680px){
  .dots{display:none}
  .center-scroll{padding-left:24px;padding-right:24px}
  .nav{padding-left:24px;padding-right:24px}
  .screen h1{font-size:25px} .big{font-size:17px} .screen:not(.top) .qlabel{font-size:16px}
}
@container (max-width:520px){
  .nav .lbl{display:none}
  .choice2{grid-template-columns:1fr}
  .sjt-opt{grid-template-columns:1fr 1fr} .sjt-opt>span:first-child{grid-column:1/-1}
  .lik-scale.wide label{width:50px;height:50px}
}

/* Estimation : question seule au centre, journaux grisés, aperçu à droite */
.pane.off{opacity:.36;filter:grayscale(1);pointer-events:none;-webkit-user-select:none;user-select:none}
.pane-b>*{flex-shrink:0}
.pane.preview h2{font-size:19px}
.pane.preview .fig{margin:0}
.screen.ask{align-items:center;text-align:center;gap:20px;max-width:560px}
.ask-row{display:flex;align-items:baseline;justify-content:center;gap:12px}
.ask-row input[type=number]{width:170px;font-family:var(--display);font-size:40px;font-weight:600;line-height:1.2;text-align:center;color:var(--brand);padding:10px 8px;border-radius:12px}
.ask-row .unit{font-size:18px;color:var(--ink-60)}

/* Journaux */
.pane-h .grow{min-width:max-content}
.btn.x{padding:0;width:30px;justify-content:center;background:transparent;box-shadow:none;color:var(--slate);font-size:13px}
.btn.x:hover{background:var(--wash)}
.rich.journal{flex:1;min-height:260px;overflow:auto}

/* Boutons */
button{font-family:var(--font)}
.btn{appearance:none;border:0;cursor:pointer;min-height:36px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:500;background:var(--white);color:var(--brand);box-shadow:inset 0 0 0 1px rgba(1,78,126,.35);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f3f8fb}
.btn.pri{background:var(--brand);color:#fff;box-shadow:none} .btn.pri:hover{background:#003f66}
.btn.cta{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(0,128,255,.22);border-radius:999px;min-height:44px;padding:0 26px;font-weight:600} .btn.cta:hover{background:#0073e6}
.btn.danger{color:var(--danger);box-shadow:inset 0 0 0 1px rgba(163,0,0,.4)}
.btn.sm{min-height:30px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(0,128,255,.3)!important}

/* Énoncés protégés */
.protected{-webkit-user-select:none;user-select:none}
.protected img{-webkit-user-drag:none;pointer-events:none}
.stmt table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:13px}
.stmt th,.stmt td{text-align:left;padding:6px 10px;box-shadow:inset 0 -1px 0 var(--line);vertical-align:top}
.stmt th{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.sec-h{margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.fig{margin:4px 0 6px;border-radius:10px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.fig img{display:block;width:100%;height:auto}
.fig figcaption{font-size:11px;color:var(--ink-60);padding:6px 12px;border-top:1px solid var(--line)}
.fig-wrap{overflow-x:auto}
.qblock{display:flex;flex-direction:column;gap:6px;margin:14px 0 0}
.qlabel{font-weight:500}

/* Champs */
input[type=text],input[type=email],input[type=number],select,textarea,.rich{font-family:var(--font);font-size:14px;color:var(--ink);background:#fff;border:0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-strong);padding:9px 12px;width:100%;line-height:1.55}
textarea{resize:vertical;min-height:70px}
textarea.code{font-family:var(--mono);font-size:12.5px;min-height:200px;white-space:pre;overflow:auto;tab-size:4}
.rich{min-height:92px;outline:none;overflow-wrap:anywhere}
.rich:empty::before{content:attr(data-ph);color:var(--ink-45)}
.rich pre{font-family:var(--mono);font-size:12.5px;background:var(--wash);padding:8px 10px;border-radius:6px;white-space:pre-wrap;margin:6px 0}
.rich p{margin:0 0 6px}
.rtb{display:flex;flex-wrap:wrap;gap:2px 4px;margin-bottom:-2px}
.rtb button{white-space:nowrap;appearance:none;border:0;cursor:pointer;min-width:30px;height:26px;padding:0 7px;border-radius:6px;background:transparent;color:var(--slate);font-size:12px;font-weight:600}
.rtb button:hover{background:var(--wash)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--slate)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* Mises en situation */
.sjt{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.sjt-opt{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:start;padding:8px 10px;border-radius:8px}
.sjt-opt:nth-child(odd){background:rgba(1,78,126,.035)}
.pick{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap;padding:3px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line-strong);background:#fff}
.pick input{accent-color:var(--brand);margin:0}
.pick.plus:has(input:checked){background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(31,157,85,.45)}
.pick.moins:has(input:checked){background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(232,116,42,.45)}
.val-list{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.val-list span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--wash);color:var(--brand)}
.pref{display:grid;grid-template-columns:36px 1fr 1fr;gap:8px;align-items:stretch;margin-top:8px}
.pref .pick{white-space:normal;border-radius:8px;padding:8px 10px;font-weight:500;font-size:13px;align-items:flex-start}
.lik{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lik-scale{display:flex;gap:4px}
.lik-scale label{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--line-strong);font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;position:relative}
.lik-scale input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.lik-scale label:has(input:checked){background:var(--brand);color:#fff;box-shadow:none}
.lik-scale label:has(input:focus-visible){box-shadow:0 0 0 3px rgba(0,128,255,.3)}

/* Tableaux à compléter */
.tbl-wrap{overflow-x:auto;margin-top:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.fill{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
table.fill th{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);text-align:left;padding:8px 10px;background:rgba(1,78,126,.04);vertical-align:bottom}
table.fill td{padding:6px 8px;vertical-align:top;border-top:1px solid var(--line)}
table.fill td.fx{padding:9px 10px}
table.fill textarea{min-height:44px;padding:6px 8px;font-size:13px;box-shadow:inset 0 0 0 1px var(--line)}
table.fill select{padding:6px 8px;font-size:13px;min-width:74px}
table.data{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.data th{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);text-align:left;padding:6px 10px}
table.data td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.data td.n,table.data th.n{text-align:right;white-space:nowrap}

.rich-view{white-space:normal} .rich-view pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;margin:6px 0}
/* Fenêtres */
.veil{position:fixed;inset:0;z-index:40;background:rgba(0,24,40,.38);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);padding:22px 24px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.tabs{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--line-strong)}
.tabs button{white-space:nowrap;appearance:none;border:0;cursor:pointer;min-height:28px;padding:0 12px;border-radius:6px;background:transparent;color:var(--slate);font-size:12px;font-weight:500}
.tabs button[aria-pressed=true]{background:var(--brand);color:#fff}
.entry{border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px;font-size:13px}
.entry .meta{font-size:11px;color:var(--ink-45);margin-bottom:4px}
.entry dt{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-top:6px}
.entry dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

.note{border-radius:10px;padding:10px 14px;font-size:13px;background:#e6eef4;color:var(--slate)}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.err{background:var(--danger-bg);color:var(--danger)} .note.ok{background:var(--ok-bg);color:var(--ok)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#e6eef4;color:var(--slate)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.run{background:#e0f0ff;color:#005fbf}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(159,162,164,.45);padding:12px 16px}
.kpi b{display:block;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.2;color:var(--brand)}
.ribbon{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:500;padding:6px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.ans{white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(1,78,126,.035);border-radius:8px;padding:8px 12px;margin:4px 0 12px;font-size:13px}
.ans.code{font-family:var(--mono);font-size:12px;overflow-x:auto;white-space:pre}
.ans:empty::before{content:"(vide)";color:var(--ink-45)}
details.acc{border-top:1px solid var(--line);padding:10px 0}
details.acc>summary{cursor:pointer;font-weight:600;color:var(--brand);list-style-position:outside}
.up-prev{max-width:420px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);display:block;margin-top:6px}
.kitfile{margin-top:8px}
.kitfile textarea{font-family:var(--mono);font-size:12px;min-height:120px;white-space:pre}
@media (max-width:899px){
  .hdr{padding:12px 16px 8px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:6px 12px;align-items:center}
  .logo{width:88px;margin-left:-7px}
  .hdr-title b{font-size:14px}
  .progress{margin:0 16px}
  .center-scroll{padding:6px 16px 20px}
  .nav{padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
  .dots{display:none}
  .split{display:none}
  .pane{position:fixed;inset:0;z-index:25;width:auto!important;background:var(--page);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .pane .pane-h,.pane .pane-b{padding-left:max(16px,env(safe-area-inset-left,0px))!important;padding-right:max(16px,env(safe-area-inset-right,0px))!important}
  .screen h1{font-size:24px} .big{font-size:17px}
  .lik-scale.wide label{width:50px;height:50px}
}
@media (max-width:560px){
  .choice2{grid-template-columns:1fr}
  h1{font-size:22px}
  .sjt-opt{grid-template-columns:1fr 1fr} .sjt-opt>span:first-child{grid-column:1/-1}
  .pref{grid-template-columns:1fr} .lik{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Ajouts pour la plateforme de cours ===== */
[hidden]{display:none!important}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:60;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)} #toast.err{background:var(--danger)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:2px}
.btn.name{justify-content:flex-start;min-height:42px;font-weight:400;color:var(--ink);white-space:normal;text-align:left}
.btn.name b{font-weight:600;color:var(--brand)}
input.code-in{font-family:var(--mono);font-size:28px;letter-spacing:.3em;text-transform:uppercase;text-align:center;max-width:320px;padding:12px}
.partbar{flex:none;display:flex;gap:6px;padding:2px 44px 10px;overflow-x:auto}
.part{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 12px 0 6px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--slate);font-size:12px;font-weight:500;white-space:nowrap}
.part .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--wash);color:var(--brand);font-weight:600;font-size:11px}
.part:hover{background:var(--wash)}
.part.cur{background:var(--brand);color:#fff;box-shadow:none} .part.cur .n{background:#fff}
.part .tag{font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.part .tag.pace{background:#e0f0ff;color:#005fbf}
.qhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.who{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 9px;border-radius:999px;white-space:nowrap}
.qblock.held .rich,.qblock.held input,.qblock.held textarea,table.fill .held{box-shadow:inset 0 0 0 2px rgba(232,116,42,.6)!important;background:#fffaf5}
.rich[contenteditable=false],input[readonly],textarea[readonly],select:disabled{background:rgba(1,78,126,.035);color:var(--ink-60)}
table.fill th.n,table.fill td .n{text-align:right} table.fill th.wide,table.fill td.wide{min-width:220px}
table.fill th.act,table.fill td.act{width:36px;padding:6px 2px}
table.fill textarea{min-height:34px;height:34px;resize:none;overflow:hidden;line-height:1.4}
table.fill td{min-width:96px} table.fill td.fx{min-width:90px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--slate)}
table.fill tfoot td{padding:9px 10px;border-top:1px solid var(--line-strong);font-weight:600;color:var(--brand)} table.fill tfoot td.n{text-align:right;font-variant-numeric:tabular-nums}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.file .btn.quiet{padding:0;min-height:26px;text-align:left;white-space:normal;overflow-wrap:anywhere}
.dot-on{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line-strong);margin-right:6px;flex:none} .dot-on.on{background:#1f9d55}
.pill.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--ink-45)}
.veil.lock{background:rgba(0,24,40,.72)}
.jform{padding-top:12px;border-top:1px solid var(--line)}
.btn.sm.quiet{min-height:24px}
/* Backoffice */
.adm{max-width:1500px;margin:0 auto;padding-bottom:80px}
.adm .hdr{padding-bottom:8px}
.adm>.note{margin:0 44px 10px}
.ctl{display:flex;flex-wrap:wrap;gap:14px 28px;padding:12px 44px 16px;border-bottom:1px solid var(--line)}
.ctl-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.pacebtn{max-width:230px;overflow:hidden;text-overflow:ellipsis;display:inline-block;line-height:30px}
.pacebtn:disabled{opacity:1}
.adm-body{display:flex;flex-direction:column;gap:16px;padding:18px 44px}
body:has(.drawer) .adm{margin-right:min(620px,48vw)}
table.promo td{vertical-align:middle}
.rowlink{cursor:pointer} .rowlink:hover td{background:rgba(1,78,126,.035)} .rowlink.sel td{background:#e9f3fb}
.who-c{display:flex;align-items:center;gap:10px}
.ava{flex:none;width:38px;height:38px;border-radius:50%;background:var(--wash);color:var(--brand);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;text-transform:uppercase}
.ava img{width:100%;height:100%;object-fit:cover}
.bar{width:110px;height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:inline-block;margin-right:8px;vertical-align:middle} .bar i{display:block;height:100%;background:var(--accent)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,48vw);z-index:20;background:#fff;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.drawer-b{flex:1;overflow:auto;padding:20px 24px 60px;display:flex;flex-direction:column;gap:14px}
.drawer-b>*{flex-shrink:0}
.sub{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.codecard{border:1px dashed var(--line-strong);border-radius:8px;padding:10px 14px;break-inside:avoid}
.bigcode{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:.18em;color:var(--brand);margin-top:4px}
@media (max-width:899px){.partbar{padding:2px 16px 8px}.ctl,.adm-body{padding-left:16px;padding-right:16px}.drawer{width:100%}body:has(.drawer) .adm{margin-right:0}}
@media print{
  body{background:#fff} .noprint,.hdr,.ctl,.drawer,#toast{display:none!important}
  .adm-body{padding:0} .codes{grid-template-columns:repeat(3,1fr);gap:0} .codecard{border-radius:0;margin:-0.5px;padding:14px 16px}
}
.pill{white-space:nowrap}
table.fill td{min-width:84px} table.fill th.wide,table.fill td.wide{min-width:170px}
table.promo .pill{margin:1px 0}

/* Éditeur collaboratif */
.yq{display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-strong)}
.yq .ql-toolbar.ql-snow{border:0;border-bottom:1px solid var(--line);padding:4px 6px;font-family:var(--font)}
.yq .ql-container.ql-snow{border:0;font-family:var(--font);font-size:14px}
.yq .ql-editor{min-height:110px;padding:10px 12px;line-height:1.6;overflow-wrap:anywhere}
.yq .ql-editor.ql-blank::before{font-style:normal;color:var(--ink-45);left:12px}
.yq .ql-editor .ql-code-block-container{font-family:var(--mono);font-size:12.5px;background:var(--wash);color:var(--ink);border-radius:6px;padding:6px 10px}
.yq.ro{background:rgba(1,78,126,.035)} .yq.ro .ql-editor{color:var(--ink-60)}
.yq:focus-within{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px rgba(0,128,255,.18)}
.yq .ql-editor:focus-visible{box-shadow:none!important}
.yq .ql-undo::after{content:"\21B6";font-size:16px;line-height:1} .yq .ql-redo::after{content:"\21B7";font-size:16px;line-height:1}
.yq .ql-cursor-flag{font-family:var(--font);border-radius:4px}
.yq.journal{flex:1;min-height:300px} .yq.journal .ql-container{flex:1;min-height:0;overflow:auto} .yq.journal .ql-editor{min-height:240px}
.screen:not(.top) .yq .ql-editor{min-height:150px}
/* Galerie de photos */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.gal-i{appearance:none;border:0;padding:0;cursor:zoom-in;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--wash);box-shadow:inset 0 0 0 1px var(--line)}
.gal-i img{width:100%;height:100%;object-fit:cover;display:block} .gal-i img:not([src]){visibility:hidden} .gal-i.ko{display:none}

/* Tableaux : poignée de déplacement, lignes héritées, tableau comparatif */
.grip{display:inline-flex;align-items:center;justify-content:center;width:24px;height:30px;cursor:grab;color:var(--ink-45);font-size:15px;border-radius:6px;user-select:none}
.grip:hover{background:var(--wash);color:var(--brand)} .grip:active{cursor:grabbing}
table.fill tr.dragging{opacity:.45}
table.fill tr.drop-before td{box-shadow:inset 0 3px 0 var(--accent)} table.fill tr.drop-after td{box-shadow:inset 0 -3px 0 var(--accent)}
tr.inh-row td{background:rgba(159,162,164,.12);color:var(--ink-60)}
table.fill tr.inh-row td.fx{white-space:normal;min-width:84px}
tr.inh-row.struck td:not(.act){text-decoration:line-through;color:var(--ink-45)}
.btn.sm.strike{min-height:26px;padding:0 8px;font-size:11px}
table.fill th.act:first-child,table.fill td.act:first-child{width:28px;padding:6px 0 6px 4px}
table.fill.matrix th.crit{min-width:170px;max-width:220px;text-align:left;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--brand);background:rgba(1,78,126,.04);padding:8px 10px;vertical-align:top}
table.fill.matrix tbody th.crit textarea{font-weight:600}
table.fill.matrix td{min-width:150px}
.hdr .logo{width:112px;margin:0 6px -4px -6px}
.wrap .logo{width:120px;margin-left:-8px}
table.fill tfoot td.tl{text-align:right}
.grip[hidden]{display:none!important}

/* Tableaux : affichage sur une ligne, colonnes de produits, lien, vue d'un produit en grand */
.qhead .btn.sm{flex:none}
table.fill.oneline textarea{height:34px!important;white-space:nowrap;overflow:hidden}
table.fill.oneline tr.inh-row td.fx,table.fill.oneline th.crit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
table.fill.matrix th.prod{white-space:nowrap;min-width:170px}
table.fill.matrix th.prod span{margin-right:4px;vertical-align:middle}
table.fill.matrix th.prod .btn.x{width:24px;min-height:24px;font-size:13px;vertical-align:middle}
table.fill.matrix th.act.add{width:auto;padding:6px 8px;vertical-align:middle}
.linkcell{display:flex;align-items:center;gap:6px;min-height:34px}
.linkcell a{font-weight:600}
.linkcell input{padding:6px 8px;font-size:13px;box-shadow:inset 0 0 0 1px var(--line)}
.linkcell .btn.x{width:24px;min-height:24px;font-size:12px}
.linkcell.held input{box-shadow:inset 0 0 0 2px rgba(232,116,42,.6)!important;background:#fffaf5}
.prodform{display:flex;flex-direction:column;gap:14px;padding:16px 18px!important}
.prodform label.f{font-size:13px;color:var(--brand);font-weight:600}
.prodform textarea{min-height:92px;font-size:14px;font-weight:400;resize:vertical}
/* Colonnes d'action (poignée, suppression) : largeur au plus juste ; tableau comparatif sur toute la largeur disponible */
table.fill th.act,table.fill td.act{min-width:0;width:30px;padding:6px 2px;text-align:center}
table.fill th.act:first-child,table.fill td.act:first-child{min-width:0;width:26px;padding:6px 0 6px 2px}
table.fill td.act .grip{width:22px}
.screen:has(table.matrix){max-width:none}
.screen:has(table.matrix)~.est,.est:has(~.screen table.matrix){max-width:none}
table.fill.matrix{width:100%}
table.fill.matrix th.prod{min-width:150px}
table.fill.matrix td{min-width:150px}
table.fill.matrix td.act{min-width:0}
table.fill.matrix th.crit{width:190px}
.center-scroll:has(table.matrix){padding-left:20px;padding-right:20px}

/* ===== Version 2 ===== */
#ver{position:fixed;right:8px;bottom:4px;z-index:5;font-size:10px;line-height:1;color:rgba(0,24,40,.28);pointer-events:none;user-select:none;font-variant-numeric:tabular-nums}
@media print{#ver{display:none}}
/* Étudiant : aide, prise de parole, participation */
.hdr-tools .btn.helpbtn.on{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(232,116,42,.55);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 1px rgba(232,116,42,.55),0 0 0 5px rgba(232,116,42,.16)}}
.veil.hold{z-index:70;background:rgba(0,24,40,.86)}
.veil.hold .modal{text-align:center;align-items:center;padding:34px 36px;width:min(620px,100%)}
.veil.hold .modal h2{font-size:26px}
.idlebar{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:35;width:min(820px,calc(100% - 24px));display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;background:#fff7f0;color:var(--warn);font-size:13px;line-height:1.45;box-shadow:var(--shadow-lg),inset 0 0 0 1px rgba(232,116,42,.55)}
.idlebar .btn{flex:none}
/* Backoffice : navigation, état en direct */
.adm-nav{padding:0 44px 12px;overflow-x:auto}
.adm .hdr{align-items:center}
.pill.helpcount{border:0;cursor:pointer;font-family:inherit}
.btn.holdon{animation:pulse 1.6s ease-in-out infinite}
.seg{display:inline-flex;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line-strong);overflow:hidden;flex:none}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:11px;font-weight:500;color:var(--slate);padding:4px 9px;cursor:pointer;min-height:26px}
.seg button+button{box-shadow:inset 1px 0 0 var(--line-strong)}
.seg button:hover{background:var(--wash)}
.seg button.on.ok{background:var(--ok-bg);color:var(--ok);font-weight:600} .seg button.on.no{background:var(--danger-bg);color:var(--danger);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.scorerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:4px 0 2px}
.scoresel{width:auto;min-height:28px;padding:2px 26px 2px 8px;font-size:12px}
.pill.qual{font-variant-numeric:tabular-nums}
.pill.qual.q0{background:#eef1f3;color:var(--ink-45)} .pill.qual.q1{background:var(--danger-bg);color:var(--danger)} .pill.qual.q2{background:var(--warn-bg);color:var(--warn)}
.pill.qual.q3{background:#fff6d6;color:#6b5200} .pill.qual.q4{background:#e3f4e8;color:var(--ok)} .pill.qual.q5{background:#c9ecd5;color:#0d5a2e}
/* Galerie des étudiants */
.ava.big{width:92px;height:92px;border-radius:16px;font-size:24px} .ava.mid{width:54px;height:54px;border-radius:12px;font-size:15px} .ava.mini{width:28px;height:28px;font-size:10px}
.sgal{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.gcard{position:relative;width:148px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.gcard.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.gcard.absent .ava{filter:grayscale(1);opacity:.5}
.gcard.help{box-shadow:inset 0 0 0 2px #e8742a,0 0 0 5px rgba(232,116,42,.16);background:#fffaf5}
.gphoto{position:relative;appearance:none;border:0;background:transparent;padding:0;cursor:pointer;border-radius:16px;line-height:0}
.gphoto:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gdot{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:#b9c0c5;box-shadow:0 0 0 3px #fff}
.gdot.on{background:#1f9d55}
.ghelp{position:absolute;left:-8px;top:-8px;width:28px;height:28px;border-radius:50%;background:#e8742a;color:#fff;font-size:15px;line-height:28px;box-shadow:0 0 0 3px #fff;animation:pulse 1.6s ease-in-out infinite}
.gnote{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:12px;line-height:22px;box-shadow:0 0 0 1px var(--line-strong)}
.gname{font-size:12px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.gneeds{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.need{font-size:10px;line-height:1.3;padding:1px 6px;border-radius:999px;background:#eef1f3;color:var(--slate)} .need.hot{background:#e8742a;color:#fff}
.ghelpmsg{font-size:11px;line-height:1.35;color:var(--warn);font-style:italic}
.gact{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:2px}
.gphoto-w{position:relative;line-height:0}
.gcomment{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);opacity:0;transition:opacity .15s;white-space:nowrap;background:#fff!important;box-shadow:var(--shadow);min-height:26px;font-size:11px;line-height:1.2;z-index:2}
.gcard:hover .gcomment,.gcard:focus-within .gcomment{opacity:1}
@media (hover:none){.gcomment{opacity:.92}}
.gcluster{display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px;border-radius:18px;background:rgba(1,78,126,.045);box-shadow:inset 0 0 0 1px rgba(1,78,126,.16)}
.gcluster-t{font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-left:4px}
.gcluster-b{display:flex;flex-wrap:wrap;gap:8px}
.gcluster.fresh{animation:fresh 1.2s ease-out}
@keyframes fresh{0%{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 8px rgba(0,128,255,.18);background:rgba(0,128,255,.1)}}
/* Suivi de séance */
.track{position:relative;display:flex;gap:3px;margin-top:22px}
.seg-p{min-width:0;padding:8px 10px;border-radius:8px;background:#eef1f3;color:var(--slate);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.seg-p b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-p.done{background:#dfeaf1} .seg-p.cur{background:var(--brand);color:#fff}
.track .now{position:absolute;top:-18px;bottom:-6px;width:2px;background:#e8742a;transform:translateX(-1px)}
.track .now span{position:absolute;top:-2px;left:6px;font-size:10px;font-weight:600;color:#b85a1c;white-space:nowrap}
.lanes{display:flex;gap:3px}
.lane{min-width:0;display:flex;flex-direction:column;gap:4px;padding:4px 6px}
.lane-b{display:flex;flex-wrap:wrap;gap:6px}
.faces{display:inline-flex;gap:3px;align-items:center}
.face{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;border-radius:12px;line-height:0}
.face.help .ava{box-shadow:0 0 0 3px #e8742a;animation:pulse 1.6s ease-in-out infinite}
table.livs td{vertical-align:top}
.sample{appearance:none;border:0;background:transparent;font:inherit;text-align:left;padding:0;cursor:pointer;color:inherit;display:block;max-width:340px;line-height:1.4}
.sample:hover b{text-decoration:underline}
.sample .small{display:block}
.bucket-t{margin-top:8px;font-size:14px}
.bucket{display:flex;flex-wrap:wrap;gap:12px}
.gteam{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);min-width:96px}
.gteam.help{box-shadow:inset 0 0 0 2px #e8742a,0 0 0 5px rgba(232,116,42,.16);background:#fffaf5}
.gteam-f{position:relative;padding:0 6px}
.badge-q{position:absolute;left:-12px;top:-12px;box-shadow:0 0 0 2px #fff}
.badge-c{position:absolute;right:-14px;bottom:-9px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--brand);color:#fff;box-shadow:0 0 0 2px #fff;font-variant-numeric:tabular-nums}
.gteam-n{font-size:11px;color:var(--slate);max-width:190px;text-align:center}
.file.bk{padding:10px 12px}
.sub.ver ul{margin:0;padding-left:20px;font-size:13px;line-height:1.55}
.sub.ver.cur{border-top-color:var(--brand)}
@media (max-width:899px){.adm-nav{padding-left:16px;padding-right:16px}}

/* ===== Version 2.1 ===== */
.gmore{position:absolute;top:4px;right:4px;width:26px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--slate);font-size:16px;line-height:14px;font-weight:600;letter-spacing:1px;cursor:pointer;opacity:0;transition:opacity .15s;padding:0 0 6px}
.gcard:hover .gmore,.gcard:focus-within .gmore,.gmore[aria-expanded=true]{opacity:1}
.gmore:hover,.gmore:focus-visible{background:var(--wash)}
@media (hover:none){.gmore{opacity:.7}}
.gmenu{position:absolute;top:28px;right:4px;z-index:6;min-width:172px;display:flex;flex-direction:column;padding:4px;border-radius:10px;background:#fff;box-shadow:var(--shadow-lg);text-align:left}
.gmenu button{appearance:none;border:0;background:transparent;font:inherit;font-size:12px;color:var(--ink);text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer}
.gmenu button:hover,.gmenu button:focus-visible{background:var(--wash);outline:0}
.sub.first{border-top:0;padding-top:0}
.seg-p.go{appearance:none;border:0;font:inherit;text-align:left;cursor:pointer}
.seg-p.go:hover{background:#cfe0ec;box-shadow:inset 0 0 0 2px var(--brand)}
.seg-p .pbar{display:block;height:5px;border-radius:5px;background:rgba(0,24,40,.14);overflow:hidden;margin-top:4px}
.seg-p .pbar i{display:block;height:100%;background:var(--accent)}
.seg-p.cur .pbar{background:rgba(255,255,255,.28)} .seg-p.cur .pbar i{background:#fff}
.face{position:relative}
.fhelp{position:absolute;left:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:#e8742a;color:#fff;font-size:10px;line-height:18px;text-align:center;box-shadow:0 0 0 2px #fff}
.helpbox{border:0;border-radius:14px;padding:14px 16px;background:#fff7f0;box-shadow:inset 0 0 0 2px #e8742a}
.helpbox h2{color:#b85a1c;font-size:17px}
.helplist{display:flex;flex-wrap:wrap;gap:10px}
.helpitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px rgba(232,116,42,.45);min-width:280px;flex:1 1 280px;max-width:520px}
.iabox{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line-strong)}
.pv{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
.pvlist{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 210px);overflow:auto;padding-right:4px}
.pvlist .eyebrow{margin:10px 0 4px}
.pvlist button{appearance:none;border:0;background:transparent;font:inherit;font-size:12px;text-align:left;color:var(--slate);padding:6px 9px;border-radius:7px;cursor:pointer;line-height:1.35}
.pvlist button:hover{background:var(--wash)} .pvlist button[aria-current=true]{background:var(--brand);color:#fff}
.pvframe{width:100%;height:calc(100vh - 210px);min-height:560px;border:0;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line-strong),var(--shadow);background:#fff}
@media (max-width:899px){.pv{grid-template-columns:1fr}.pvlist{max-height:180px}}

/* ---------- Version 2.2 ---------- */
/* Galerie : drapeau de fin de TP, liseré bleu pour une demande d'aide (plus de macaron texte) */
.gcard.help,.gteam.help{box-shadow:inset 0 0 0 2px var(--accent);background:#fff}
.ghelp,.fhelp,.gneeds,.ghelpmsg{display:none}
.gflag{position:absolute;right:-7px;bottom:-7px;width:26px;height:26px;border-radius:9px;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line-strong),0 2px 6px rgba(1,78,126,.14)}

.face.help .ava{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent);animation:none}
/* Tuiles de groupe : note et complétion centrées sous les photos */

.ava.team{width:96px;height:96px;border-radius:14px;font-size:20px}
.gteam{padding:12px 12px 10px;gap:8px;min-width:0}
.gteam .faces{gap:5px}
.gteam-s{display:flex;justify-content:center;align-items:center;gap:4px;width:100%}

.gteam-c{font-size:11px;font-weight:600;padding:2px 6px;border-radius:999px;background:var(--brand);color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Panneau latéral : largeur réglable, ou fenêtre centrée */
.drawer{width:var(--dw,min(620px,48vw))}

.drawer-h{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:col-resize;z-index:2;touch-action:none}
.drawer-h:hover,.drawer-h:focus-visible,body.resizing .drawer-h{background:rgba(0,128,255,.22);outline:0}
body.resizing{user-select:none;cursor:col-resize}
.drawer.win{top:10vh;bottom:auto;left:10vw;right:auto;width:80vw;height:80vh;border-radius:16px;z-index:31;overflow:hidden}

.drawer-veil{position:fixed;inset:0;z-index:30;background:rgba(0,24,40,.38)}

/* Réglages d'envoi */
#mail-box input[type=password]{font-family:var(--font);font-size:14px;color:var(--ink);background:#fff;border:0;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-strong);padding:9px 12px;width:100%;line-height:1.55}

.mailgrid{display:grid;grid-template-columns:2fr 90px 2fr 2fr 2fr;gap:10px;align-items:end}

.rcell:hover,.rcell:focus-visible{background:var(--wash);outline:0}
.gr{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;background:#eef1f3;color:var(--slate)}
.gr-TB{background:var(--brand);color:#fff} .gr-B{background:#cfe0ec;color:var(--brand)} .gr-AB{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)} .gr-NOK{background:#fff;color:#a23b1c;box-shadow:inset 0 0 0 1px #d9a08c}
.gr.prop{opacity:.55;font-style:italic;font-weight:500}
.rcom{font-size:11px}
.rcomment{appearance:none;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer;padding:4px 6px;border-radius:8px;max-width:420px;color:inherit;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcomment:hover,.rcomment:focus-visible{background:var(--wash);outline:0} .rcomment.muted{color:var(--slate);opacity:.7}
.rpop{position:absolute;z-index:35;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg),0 0 0 1px var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:9px;overflow:auto}
.rpop h3{margin:0;font-size:16px}
.rpop>*{flex-shrink:0}
.rchoice{display:flex;flex-direction:column;gap:2px}
.ropt{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.ropt:hover{background:var(--wash)} .ropt input{accent-color:var(--brand);flex:none}
.ropt:has(input:checked){background:var(--wash);font-weight:600}
.rlivs{display:flex;flex-direction:column;gap:2px;font-size:12.5px;max-height:210px;overflow:auto;padding:6px 8px;border-radius:10px;background:rgba(1,78,126,.035)}
.rlivs-p{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-top:5px}
.rliv{display:flex;align-items:center;gap:8px;padding:2px 0}
.rn{font-variant-numeric:tabular-nums;color:var(--slate);white-space:nowrap} .rn.on{color:var(--brand);font-weight:700}
.rchart{display:flex;align-items:flex-end;gap:18px;height:190px;padding:6px 4px 0}
.rbar{flex:1 1 0;max-width:120px;height:100%;display:flex;flex-direction:column;align-items:center;gap:5px}
.rbar-n{font-size:14px;font-weight:600;color:var(--brand);font-variant-numeric:tabular-nums}
.rbar-col{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid var(--line-strong)}
.rbar-col i{display:block;background:var(--brand);border-radius:6px 6px 0 0;min-height:3px} .rbar-col i.prop{background:#a9c8dd} .rbar-col i.prop+i{border-radius:0}

function livText(it, get, keys, files) {

/* ---------- Texte riche collaboratif (Yjs) ----------
   Un document Yjs par champ. Deux chemins : le canal temps réel (rapide, peut perdre des messages) et la base
   (état complet enregistré, relu à chaque synchronisation). Les fusions sont sans conflit : rien n'est écrasé. */

const COLORS = ['#0080ff', '#e8742a', '#1f9d55', '#a855f7', '#d6336c', '#0891b2', '#b45309'];
const hue = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) | 0; return COLORS[Math.abs(h) % COLORS.length]; };

  e.aw.setLocalStateField('user', {name: S.me.prenom, color: hue(S.me.id)});
  const st = YS.get(item); if (st) { try { Y.applyUpdate(doc, unb64(st.state), 'db'); } catch (x) {} }
  doc.on('update', (u, origin) => { if (origin === 'rt' || origin === 'db') return; e.out.push(u); yNeed(e); queueOut(); });
  e.aw.on('update', (ch, origin) => { if (origin === 'local') { e.awOut = true; queueOut(); } });

async function exportZip(data, name, say) {

async function readBackupFile(file) {

/* ---------- E-mails ---------- */
const mailCfg = () => (AD.st && AD.st.settings.mail) || {host: '', port: 465, user: '', name: '', otp: false, has_pass: false};

/* Réglages d'envoi (onglet Codes). Le mot de passe est enregistré en base et n'est jamais renvoyé au navigateur. */

/* ---------- Onglet Résultat ---------- */
const GRADES = [['NOK', 'NOK : insuffisant'], ['AB', 'AB : juste suffisant'], ['B', 'B : travail attendu réalisé'], ['TB', 'TB : travail au-dessus de la moyenne']];
const GRADE_FULL = Object.fromEntries(GRADES);
/* Moyenne des livrables notés (un livrable non rendu compte 0), arrondie : 0 = NOK ; 1 ou 2 = AB ; 3 ou 4 = B ; 5 = TB. */
const gradeOf = avg => { if (avg == null) return null; const r = Math.round(avg); return r <= 0 ? 'NOK' : r <= 2 ? 'AB' : r <= 4 ? 'B' : 'TB'; };
function proposedGrade(g, livs) {
  const stats = groupStats(g, livs), noted = livs.filter(l => l.it.t !== 'upload');
  if (!noted.length) return {avg: null, grade: null, stats};
  let sum = 0; noted.forEach(l => { const p = stats.per[l.it.id]; if (p.done && p.score != null) sum += p.score; });
  return {avg: sum / noted.length, grade: gradeOf(sum / noted.length), stats};
}
async function loadResults() {
  const st = AD.st, R = await aapi('cours_admin_results'), works = {};
  for (const c of st.courses) {
    if (!AD.contents[c.id]) AD.contents[c.id] = await aapi('cours_admin_course', {p_course: c.id});
    if (c.id === st.course_id) { if (workStale(0)) await loadWork(); works[c.id] = AD.work.groups; }
    else works[c.id] = (AD.res && AD.res.works[c.id]) || (await aapi('cours_admin_work2', {p_course: c.id, p_since: 0})).groups;
  }
  AD.res = {...R, works, at: Date.now(), view: (AD.res && AD.res.view) || 'final'};
}
/* Pour un étudiant et un cours : son groupe, la note proposée et la note choisie. */
function resultCell(cid, sid) {
  const R = AD.res, g = (R.works[cid] || []).find(x => x.members.includes(sid)), livs = livrablesOf(AD.contents[cid].content);
  const prop = g ? proposedGrade(g, livs) : {avg: null, grade: null, stats: null}, row = R.results.find(x => x.course === cid && x.student === sid);
  return {g, livs, prop, chosen: row && row.grade ? row.grade : null, comment: row ? row.comment : '', grade: (row && row.grade) || prop.grade};
}
function closeRpop() { document.querySelectorAll('.rpop').forEach(x => x.remove()); if (AD.rpopOff) { AD.rpopOff(); AD.rpopOff = null; } }
/* Liste déroulante d'une cellule : rappel des notes, choix de la note finale et commentaire. */
function rpop(anchor, build) {
  closeRpop();
  const p = el('div', {class: 'rpop', role: 'dialog', 'aria-label': 'Choisir la note'});
  build(p, closeRpop); document.body.append(p);
  const r = anchor.getBoundingClientRect(), w = Math.min(460, window.innerWidth - 24), left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left));
  // Sous la cellule si la place suffit ; sinon remontée pour rester entièrement visible.
  p.style.width = w + 'px'; p.style.left = left + window.scrollX + 'px'; p.style.maxHeight = (window.innerHeight - 24) + 'px';
  p.style.top = Math.max(12, Math.min(r.bottom + 6, window.innerHeight - p.offsetHeight - 12)) + window.scrollY + 'px';
  const out = e => { if (!p.contains(e.target) && !anchor.contains(e.target)) closeRpop(); }, esc = e => { if (e.key === 'Escape') { closeRpop(); anchor.focus(); } };
  document.addEventListener('pointerdown', out, true); document.addEventListener('keydown', esc, true);
  AD.rpopOff = () => { document.removeEventListener('pointerdown', out, true); document.removeEventListener('keydown', esc, true); };
  const f = p.querySelector('input,textarea,button'); if (f) f.focus();
}
function gradeChoice(name, current, noneLabel) {
  const box = el('div', {class: 'rchoice', role: 'radiogroup', 'aria-label': 'Note'});
  [...GRADES, ['', noneLabel]].forEach(([k, full]) => box.append(el('label', {class: 'ropt'}, el('input', {type: 'radio', name, value: k, checked: (current || '') === k}), el('span', null, full))));
  return {box, value: () => { const x = box.querySelector('input:checked'); return x ? x.value : ''; }};
}
function paintResults(body) {

  const U = new Map(st.students.map(u => [u.id, u])), fin = sid => R.finals.find(x => x.student === sid) || {grade: null, comment: ''};

  // 1. Répartition

    el('option', {value: 'final', selected: view === 'final'}, 'Note définitive'), courses.map(c => el('option', {value: c.id, selected: view === c.id}, c.title)));
  const counts = {}; ['NOK', 'AB', 'B', 'TB', ''].forEach(k => counts[k] = {ok: 0, prop: 0});

  [...GRADES, ['', 'Non noté']].forEach(([k, full]) => { const c = counts[k], n = c.ok + c.prop;
    chart.append(el('div', {class: 'rbar' + (k ? '' : ' none'), title: full + ' : ' + n + (c.prop ? ' (dont ' + c.prop + ' proposée' + (c.prop > 1 ? 's' : '') + ')' : '')}, el('span', {class: 'rbar-n'}, String(n)),
      el('div', {class: 'rbar-col'}, c.prop ? el('i', {class: 'prop', style: 'height:' + (100 * c.prop / max) + '%'}) : null, c.ok ? el('i', {style: 'height:' + (100 * c.ok / max) + '%'}) : null), el('span', {class: 'rbar-l'}, k || 'Non noté'))); });
  body.append(el('div', {class: 'sub first'}, el('div', {class: 'row'}, el('h2', {class: 'grow'}, 'Répartition des notes'), el('div', {style: 'min-width:240px'}, vsel)), chart,
    el('p', {class: 'small muted'}, view === 'final' ? 'Notes définitives choisies à la main, sur ' + act.length + ' étudiants.' : 'En bleu foncé : notes choisies. En bleu clair : notes proposées (moyenne des livrables notés, un livrable non rendu comptant 0 ; 0 = NOK, 1 ou 2 = AB, 3 ou 4 = B, 5 = TB).')));
  // 2. Tableau

    courses.forEach(c => {
      const x = resultCell(c.id, u.id), mates = x.g ? x.g.members.map(id => U.get(id)).filter(Boolean) : [u];

        onclick: () => rpop(btn, (p, close) => {
          const ch = gradeChoice('rg', x.chosen, x.prop.grade ? 'Pas de choix : garder la note proposée (' + x.prop.grade + ')' : 'Pas de note'), com = el('textarea', {'aria-label': 'Commentaire', placeholder: 'Commentaire pour ce cours', style: 'min-height:64px'}), err = el('p', {class: 'note err', hidden: true}); com.value = x.comment || '';
          p.append(el('p', {class: 'eyebrow'}, c.title), el('h3', null, mates.map(m => m.prenom + ' ' + m.nom).join(', ')),

            const list = el('div', {class: 'rlivs'}); let last = null;
