/* Mise en page : un écran par message, façon formulaire pas à pas. Trois panneaux redimensionnables sans fond (journaux, question, ressources) sous un en-tête épuré ; aucune carte blanche, seuls les champs de saisie sont blancs. */
:root{
  --ink:#001828; --ink-60:rgba(0,24,40,.62); --ink-45:rgba(0,24,40,.45);
  --brand:#014e7e; --slate:#1d4761; --accent:#0080ff; --accent-soft:#90caf2;
  --page:#fbfcfd; --card:rgba(255,255,255,.9); --white:#ffffff;
  --line:rgba(159,162,164,.3); --line-strong:rgba(159,162,164,.5); --wash:rgba(1,78,126,.07);
  --ok:#146b3a; --ok-bg:#e6f5ec; --warn:#8e4310; --warn-bg:#fdede2; --danger:#a30000; --danger-bg:#ffebeb;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --display:'Kodchasan','Poppins',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 0 5.5px rgba(38,50,56,.16), inset 0 0 0 1px rgba(159,162,164,.28);
  --shadow-lg:0 12px 32px rgba(0,24,40,.14), inset 0 0 0 1px rgba(159,162,164,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.6;color:var(--ink);
  background:radial-gradient(ellipse 80% 55% at 18% -5%,rgba(144,202,242,.26) 0%,rgba(144,202,242,0) 100%),radial-gradient(ellipse 70% 50% at 105% 105%,rgba(159,162,164,.14) 0%,rgba(159,162,164,0) 100%),var(--page);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1080px}
h1,h2,h3{font-family:var(--display);color:var(--brand);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0 0 10px} p:last-child{margin-bottom:0}
ul,ol{margin:0 0 10px;padding-left:22px}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.92em;background:var(--wash);padding:1px 5px;border-radius:4px}
.eyebrow{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin:0}
.card{padding:0}
.wrap>.card+.card{border-top:1px solid var(--line);padding-top:20px}
.muted{color:var(--ink-60)} .small{font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

/* En-tête épuré, sans fond */
#app.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.hdr{flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 22px;padding:20px 44px 12px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.logo{width:120px;height:auto;display:block;margin:0 0 -2px -9px}
.logo-txt{font-family:var(--display);font-weight:600;font-size:24px;color:var(--brand);letter-spacing:.01em;line-height:1}
.hdr-title{flex:1;min-width:180px;padding-bottom:3px}
.hdr-title b{display:block;font-family:var(--display);font-size:17px;font-weight:600;line-height:1.25;color:var(--brand)}
.hdr-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:2px}
.hdr-tools .btn{background:transparent}
.hdr-tools .btn:hover,.hdr-tools .btn[aria-pressed=true]{background:var(--wash)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);font-size:12px;font-weight:600;color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(232,116,42,.45)}
.chip.read{color:var(--slate)}
.save{font-size:11px;color:var(--ink-45);white-space:nowrap}
.save.err{color:var(--danger);font-weight:600}
.progress{flex:none;height:2px;margin:0 44px;border-radius:2px;background:var(--line);overflow:hidden} .progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Trois panneaux */
.cols{flex:1;min-height:0;display:flex}
.pane{flex:none;min-width:0;display:flex;flex-direction:column}
.pane.left{width:var(--wl,340px)} .pane.right{width:var(--wr,400px)}
.pane-h{flex:none;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:14px 20px 8px}
.pane.left .pane-h{padding-left:44px} .pane.right .pane-h{padding-right:44px}
.pane-b{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:6px 20px 24px}
.pane.left .pane-b{padding-left:44px} .pane.right .pane-b{padding-right:44px}
.split{flex:none;width:11px;cursor:col-resize;position:relative;touch-action:none}
.split::after{content:"";position:absolute;top:14px;bottom:14px;left:5px;width:1px;background:var(--line-strong);transition:background .15s,width .15s,left .15s}
.split:hover::after,.split:focus-visible::after,body.resizing .split::after{background:var(--accent);width:3px;left:4px}
.split:focus-visible{box-shadow:none!important}
body.resizing{cursor:col-resize;-webkit-user-select:none;user-select:none}
.center{flex:1;min-width:0;display:flex;flex-direction:column;container-type:inline-size}
.center-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:8px 44px 24px}
.screen{width:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;gap:14px;padding-block:18px}
.screen.top{margin:0 auto}
.screen:has(table.fill),.screen:has(table.data){max-width:1040px}
.screen h1{font-size:30px}
.screen>*{margin-top:0;margin-bottom:0}
.screen:not(.top) .sjt{margin-top:0;padding-top:0;border-top:0}
.screen:not(.top) .qblock{margin-top:0;gap:10px}
.screen:not(.top) .qlabel{font-size:17px;line-height:1.5}
.screen:not(.top) .sjt>p:first-child{font-size:16px}
.big{font-size:19px;line-height:1.5;margin:0}
.stmt.big{font-size:16px;line-height:1.65}
.stmt.big li{margin-bottom:8px}
.est{flex:none;width:100%;max-width:720px;margin:0 auto}
.screen:has(table.fill)~.est,.est:has(~.screen table.fill){max-width:1040px}

/* Navigation : précédent, position, suivant */
.nav{flex:none;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 44px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nav-mid{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
.dots{display:flex;flex-wrap:wrap;justify-content:center;min-width:0}
.dot{appearance:none;border:0;padding:0;background:transparent;cursor:pointer;width:13px;height:18px;position:relative;border-radius:4px}
.dot::before{content:"";position:absolute;left:3px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:background .15s,transform .15s}
.dot.done::before{background:var(--accent-soft)}
.dot.cur::before{background:var(--brand);transform:scale(1.45)}
.dot:hover::before{background:var(--accent)}
.count{font-size:12px;color:var(--ink-60);font-variant-numeric:tabular-nums;white-space:nowrap}
.nav input[type=number]{width:96px}
.btn.quiet{background:transparent;box-shadow:none;color:var(--slate);text-decoration:underline;text-underline-offset:3px;padding:0 6px}
.btn.quiet:hover{background:transparent;color:var(--brand)}

/* Choix plein écran */
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick.tile{white-space:normal;border-radius:12px;padding:18px;font-size:15px;font-weight:500;line-height:1.5;align-items:flex-start;min-height:104px;color:var(--ink)}
.pick.tile input{margin-top:5px;flex:none}
.pick.tile:hover{box-shadow:inset 0 0 0 1px var(--brand)}
.pick.tile:has(input:checked){background:#e9f3fb;color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.lik-scale.wide{gap:10px}
.lik-scale.wide label{width:58px;height:58px;font-size:18px;border-radius:12px}

/* Ressources */
.res{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res-body{overflow-x:auto;min-width:0}
.res-body img{display:block;width:100%;height:auto;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.res-body.zoomable{cursor:zoom-in}
.res-body .stmt table,.res-body table.data{font-size:12px}
.res-body .tbl-wrap{margin-top:0}
.modal.wide{width:min(1280px,100%);height:calc(100% - 20px)}
.zoom-area{flex:1;min-height:0;overflow:auto;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);background:#fff;padding:0}
.zoom-area>.stmt,.zoom-area>div:not(.stmt){padding:14px 18px}

@container (max-width:680px){
  .dots{display:none}
  .center-scroll{padding-left:24px;padding-right:24px}
  .nav{padding-left:24px;padding-right:24px}
  .screen h1{font-size:25px} .big{font-size:17px} .screen:not(.top) .qlabel{font-size:16px}
}
@container (max-width:520px){
  .nav .lbl{display:none}
  .choice2{grid-template-columns:1fr}
  .sjt-opt{grid-template-columns:1fr 1fr} .sjt-opt>span:first-child{grid-column:1/-1}
  .lik-scale.wide label{width:50px;height:50px}
}

/* Estimation : question seule au centre, journaux grisés, aperçu à droite */
.pane.off{opacity:.36;filter:grayscale(1);pointer-events:none;-webkit-user-select:none;user-select:none}
.pane-b>*{flex-shrink:0}
.pane.preview h2{font-size:19px}
.pane.preview .fig{margin:0}
.screen.ask{align-items:center;text-align:center;gap:20px;max-width:560px}
.ask-row{display:flex;align-items:baseline;justify-content:center;gap:12px}
.ask-row input[type=number]{width:170px;font-family:var(--display);font-size:40px;font-weight:600;line-height:1.2;text-align:center;color:var(--brand);padding:10px 8px;border-radius:12px}
.ask-row .unit{font-size:18px;color:var(--ink-60)}

/* Journaux */
.pane-h .grow{min-width:max-content}
.btn.x{padding:0;width:30px;justify-content:center;background:transparent;box-shadow:none;color:var(--slate);font-size:13px}
.btn.x:hover{background:var(--wash)}
.rich.journal{flex:1;min-height:260px;overflow:auto}

/* Boutons */
button{font-family:var(--font)}
.btn{appearance:none;border:0;cursor:pointer;min-height:36px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:500;background:var(--white);color:var(--brand);box-shadow:inset 0 0 0 1px rgba(1,78,126,.35);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f3f8fb}
.btn.pri{background:var(--brand);color:#fff;box-shadow:none} .btn.pri:hover{background:#003f66}
.btn.cta{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(0,128,255,.22);border-radius:999px;min-height:44px;padding:0 26px;font-weight:600} .btn.cta:hover{background:#0073e6}
.btn.danger{color:var(--danger);box-shadow:inset 0 0 0 1px rgba(163,0,0,.4)}
.btn.sm{min-height:30px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(0,128,255,.3)!important}

/* Énoncés protégés */
.protected{-webkit-user-select:none;user-select:none}
.protected img{-webkit-user-drag:none;pointer-events:none}
.stmt table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:13px}
.stmt th,.stmt td{text-align:left;padding:6px 10px;box-shadow:inset 0 -1px 0 var(--line);vertical-align:top}
.stmt th{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.sec-h{margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.fig{margin:4px 0 6px;border-radius:10px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.fig img{display:block;width:100%;height:auto}
.fig figcaption{font-size:11px;color:var(--ink-60);padding:6px 12px;border-top:1px solid var(--line)}
.fig-wrap{overflow-x:auto}
.qblock{display:flex;flex-direction:column;gap:6px;margin:14px 0 0}
.qlabel{font-weight:500}

/* Champs */

.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#e6eef4;color:var(--slate)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.run{background:#e0f0ff;color:#005fbf}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(159,162,164,.45);padding:12px 16px}

.ribbon{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:500;padding:6px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.ans{white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(1,78,126,.035);border-radius:8px;padding:8px 12px;margin:4px 0 12px;font-size:13px}

.ans:empty::before{content:"(vide)";color:var(--ink-45)}

.up-prev{max-width:420px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);display:block;margin-top:6px}

  .dots{display:none}

}

.qhead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}

.bar{width:110px;height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:inline-block;margin-right:8px;vertical-align:middle} .bar i{display:block;height:100%;background:var(--accent)}
